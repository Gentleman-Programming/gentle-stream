[project]
name = "gentle-stream"
version = "0.1.0"
description = "Real-time generative music in your terminal, steered by moods that Gentle Shell interprets with the model you choose."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alan Buscaglia (Gentleman Programming)" }
]
keywords = ["generative-music", "lofi", "music", "synthesizer", "tui", "textual", "terminal", "gentle-shell", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/Gentleman-Programming/gentle-stream"
Repository = "https://github.com/Gentleman-Programming/gentle-stream"
Issues = "https://github.com/Gentleman-Programming/gentle-stream/issues"

[project.scripts]
gentle-stream = "gentle_stream:main"

[project.optional-dependencies]
samples = [
    "pyfluidsynth>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyfluidsynth>=1.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
