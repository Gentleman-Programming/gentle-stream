[project]
name = "gentle-stream"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "gentlemanprogramming@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "textual>=8.2.8",
]

[project.scripts]
gentle-stream = "gentle_stream:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
